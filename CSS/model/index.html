<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тестовое</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header__row">
        <a class="logo" href="#">Додзё Медиа</a>
        <nav class="nav">
          <a href="#">Проекты</a>
          <a href="#">Подход</a>
          <a href="#">Контакты</a>
        </nav>
        <a class="btn" href="#">Обсудить проект →</a>
      </div>
    </header>
    <main>
      <section class="layout">
        <div class="layout__grid">
          <div class="layout__left">
            <p class="label">Сайты · поиск · смысл</p>
            <h1 class="layout__title">
              Цифровое ремесло.<br />Измеримый результат.
            </h1>
          </div>
          <div class="layout__right">
            <p class="layout__text">
              Собираем сайты, поиск и рекламу в единую систему. Помогаем
              амбициозным брендам расти.
            </p>
            <p class="label">Из Ярославля — в любую точку мира</p>
          </div>
        </div>
        <img
          class="layout__image"
          src="img/people.png"
          alt="Команда за общим столом"
        />
      </section>
    </main>
    <section class="main">
      <div class="main__flex">
        <h2 class="main__title">Избранные работы</h2>
        <p class="main_text">ТРИ ПРОЕКТА. ТРИ ИСТОРИИ.</p>
      </div>
    </section>
    <footer></footer>
  </body>
</html>
